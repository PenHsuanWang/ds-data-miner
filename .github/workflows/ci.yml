# CI — runs on every PR targeting `main` or `dev`
# Jobs run in parallel; all must pass for the PR to be mergeable.
#
# Job matrix:
#   lint       — ruff check + format (fast, no Python install)
#   typecheck  — mypy --strict
#   test       — pytest matrix: py3.10, py3.11, py3.12, py3.13
#   docs       — sphinx-build -W (warnings-as-errors)

name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - dev
  push:
    branches:
      - main
      - master
      - dev

# Cancel in-flight runs for the same PR/branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Lint — ruff check + format (no test deps, fastest job)
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ruff
        run: uv pip install ruff --system

      - name: ruff lint
        run: ruff check src/ tests/

      - name: ruff format check
        run: ruff format --check src/ tests/

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Type-check — mypy --strict
  # ──────────────────────────────────────────────────────────────────────────
  typecheck:
    name: "Type Check (mypy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package + mypy deps
        run: |
          uv pip install -e ".[dev]" --system
          uv pip install mypy pydantic numpy scipy pandas-stubs --system

      - name: mypy
        run: mypy src/

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Test matrix — pytest across Python 3.10 → 3.13
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: "Test / py${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false           # show failures for all Python versions
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install package + dev extras (including pandas)
        run: uv pip install -e ".[dev,pandas]" --system

      - name: Run pytest with coverage
        run: |
          pytest \
            --tb=short \
            --cov=ds_data_miner \
            --cov-report=term-missing \
            --cov-report=xml \
            -q

      - name: Upload coverage to Codecov
        # Only upload once (from py3.12) to avoid duplicate reports
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Docs — sphinx-build with warnings-as-errors
  # ──────────────────────────────────────────────────────────────────────────
  docs:
    name: "Docs (sphinx)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package + docs extras
        run: uv pip install -e ".[docs,pandas]" --system

      - name: Build Sphinx docs (warnings = errors)
        run: sphinx-build -W -b html docs/ docs/_build/html

      - name: Upload built docs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/_build/html/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # 5. Smoke test — run smoke_test.py end-to-end functional check
  # ──────────────────────────────────────────────────────────────────────────
  smoke:
    name: "Smoke Test (end-to-end)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package + pandas
        run: uv pip install -e ".[pandas]" --system

      - name: Run smoke test
        run: python smoke_test.py
