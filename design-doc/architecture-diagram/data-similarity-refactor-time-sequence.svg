<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1150" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- 同步呼叫箭頭 (實心) -->
    <marker id="sync-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
    </marker>
    <!-- 回傳呼叫箭頭 (空心/開放) -->
    <marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8" fill="none" stroke="#666666" stroke-width="1.5" />
    </marker>

    <!-- 樣式定義 -->
    <style>
      .lifeline { stroke: #9e9e9e; stroke-width: 1.5; stroke-dasharray: 6,4; }
      .actor { fill: #f5f5f5; stroke: #616161; stroke-width: 2; rx: 4; }
      .layer-adapter { fill: #e8f5e9; stroke: #4caf50; stroke-width: 2; rx: 4; }
      .layer-app { fill: #e0f7fa; stroke: #00acc1; stroke-width: 2; rx: 4; }
      .layer-domain { fill: #e3f2fd; stroke: #1e88e5; stroke-width: 2; rx: 4; }
      
      .activation { fill: #bbdefb; stroke: #1976d2; stroke-width: 1.5; }
      .activation-app { fill: #b2ebf2; stroke: #0097a7; stroke-width: 1.5; }
      .activation-adapter { fill: #c8e6c9; stroke: #388e3c; stroke-width: 1.5; }

      .msg-line { stroke: #333333; stroke-width: 1.5; fill: none; }
      .msg-return { stroke: #666666; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .msg-text { font-size: 13px; fill: #212121; font-family: monospace; }
      
      .fragment-box { fill: transparent; stroke: #9e9e9e; stroke-width: 1.5; }
      .fragment-header { fill: #eeeeee; stroke: #9e9e9e; stroke-width: 1.5; }
      .fragment-label { font-size: 12px; font-weight: bold; fill: #424242; }
      .fragment-condition { font-size: 11px; font-weight: bold; fill: #d32f2f; font-style: italic; }
      .fragment-divider { stroke: #9e9e9e; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      
      .note-box { fill: #fff9c4; stroke: #fbc02d; stroke-width: 1.5; rx: 4; }
      .note-text { font-size: 12px; fill: #424242; font-family: sans-serif; }
    </style>
  </defs>

  <!-- ==================== Lifelines (垂直虛線) ==================== -->
  <line x1="80" y1="120" x2="80" y2="1100" class="lifeline" />
  <line x1="260" y1="120" x2="260" y2="1100" class="lifeline" />
  <line x1="480" y1="120" x2="480" y2="1100" class="lifeline" />
  <line x1="700" y1="120" x2="700" y2="1100" class="lifeline" />
  <line x1="880" y1="120" x2="880" y2="1100" class="lifeline" />
  <line x1="1060" y1="120" x2="1060" y2="1100" class="lifeline" />
  <line x1="1220" y1="120" x2="1220" y2="1100" class="lifeline" />

  <!-- ==================== Actors & Objects (頂部生命線標頭) ==================== -->
  <rect x="40" y="50" width="80" height="40" class="actor" />
  <text x="80" y="75" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">User</text>

  <rect x="180" y="40" width="160" height="60" class="layer-adapter" />
  <text x="260" y="62" font-size="11" fill="#2e7d32" text-anchor="middle">&lt;&lt;Adapter&gt;&gt;</text>
  <text x="260" y="80" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">:TrustAccessor</text>

  <rect x="380" y="40" width="200" height="60" class="layer-app" />
  <text x="480" y="62" font-size="11" fill="#006064" text-anchor="middle">&lt;&lt;Application&gt;&gt;</text>
  <text x="480" y="80" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">:BivariateDiagnosticEngine</text>

  <rect x="620" y="40" width="160" height="60" class="layer-domain" />
  <text x="700" y="62" font-size="11" fill="#1565c0" text-anchor="middle">&lt;&lt;Domain&gt;&gt;</text>
  <text x="700" y="80" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">:EvidenceCollector</text>

  <rect x="800" y="40" width="160" height="60" class="layer-domain" />
  <text x="880" y="62" font-size="11" fill="#1565c0" text-anchor="middle">&lt;&lt;Domain&gt;&gt;</text>
  <text x="880" y="80" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">:MetricSelector</text>

  <rect x="980" y="40" width="160" height="60" class="layer-domain" />
  <text x="1060" y="62" font-size="11" fill="#1565c0" text-anchor="middle">&lt;&lt;Domain&gt;&gt;</text>
  <text x="1060" y="80" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">:MetricRegistry</text>

  <rect x="1140" y="40" width="160" height="60" class="layer-domain" />
  <text x="1220" y="62" font-size="11" fill="#1565c0" text-anchor="middle">&lt;&lt;Domain&gt;&gt;</text>
  <text x="1220" y="80" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">:EffectSizeStrategy</text>


  <!-- ==================== Execution Specifications (Activations) ==================== -->
  <rect x="252" y="160" width="16" height="900" class="activation-adapter" /> <!-- Accessor -->
  <rect x="472" y="240" width="16" height="780" class="activation-app" /> <!-- Engine -->
  <rect x="692" y="280" width="16" height="230" class="activation" /> <!-- Collector -->
  <rect x="872" y="550" width="16" height="280" class="activation" /> <!-- Selector -->
  <rect x="1052" y="700" width="16" height="40" class="activation" /> <!-- Registry -->
  <rect x="1212" y="880" width="16" height="50" class="activation" /> <!-- Strategy -->


  <!-- ==================== Messages (呼叫順序) ==================== -->
  
  <!-- 1. User -> Accessor -->
  <path d="M 80 160 L 250 160" class="msg-line" marker-end="url(#sync-arrow)" />
  <text x="90" y="152" class="msg-text">diagnose(x, y, grouping_cols)</text>

  <!-- 2. Accessor self-call (NaN 防禦) -->
  <path d="M 268 180 L 310 180 L 310 210 L 268 210" class="msg-line" marker-end="url(#sync-arrow)" />
  <text x="315" y="198" class="msg-text">extract_arrays_and_drop_nan()</text>

  <!-- 3. Accessor -> Engine -->
  <path d="M 268 240 L 470 240" class="msg-line" marker-end="url(#sync-arrow)" />
  <text x="278" y="232" class="msg-text">diagnose(x_arr, y_arr, missing_strategy)</text>

  <!-- 4. Engine -> Collector -->
  <path d="M 488 280 L 690 280" class="msg-line" marker-end="url(#sync-arrow)" />
  <text x="510" y="272" class="msg-text">collect(x, y, ...)</text>

  <!-- Collector Self-Calls (蒐證階段) -->
  <path d="M 708 300 L 740 300 L 740 330 L 708 330" class="msg-line" marker-end="url(#sync-arrow)" />
  <text x="745" y="318" class="msg-text">detect_structure()</text>

  <path d="M 708 350 L 740 350 L 740 380 L 708 380" class="msg-line" marker-end="url(#sync-arrow)" />
  <text x="745" y="368" class="msg-text">check_dependency_risk()</text>

  <path d="M 708 400 L 740 400 L 740 430 L 708 430" class="msg-line" marker-end="url(#sync-arrow)" />
  <text x="745" y="418" class="msg-text">run_statistical_tests(Normality, Variance)</text>

  <!-- 5. Collector -> Engine (Return Evidence) -->
  <path d="M 690 510 L 488 510" class="msg-return" marker-end="url(#return-arrow)" />
  <text x="510" y="502" class="msg-text">DiagnosticEvidence</text>

  <!-- 6. Engine -> Selector -->
  <path d="M 488 550 L 870 550" class="msg-line" marker-end="url(#sync-arrow)" />
  <text x="510" y="542" class="msg-text">select(evidence, registry)</text>


  <!-- ==================== ALT Fragment: Metric Selection Logic ==================== -->
  <rect x="200" y="590" width="1070" height="260" class="fragment-box" />
  <rect x="200" y="590" width="45" height="20" class="fragment-header" />
  <text x="205" y="604" class="fragment-label">alt</text>
  <text x="255" y="605" class="fragment-condition">[if pseudo-replication or insufficient evidence]</text>

  <!-- [Condition 1: Dependency/Warning] -->
  <path d="M 872 630 L 488 630" class="msg-return" marker-end="url(#return-arrow)" />
  <text x="510" y="622" class="msg-text" fill="#d32f2f">InsufficientEvidence / Warning</text>

  <path d="M 472 650 L 268 650" class="msg-return" marker-end="url(#return-arrow)" />
  <text x="278" y="642" class="msg-text" fill="#d32f2f">return Warning / Abort</text>

  <!-- Fragment Divider (Else) -->
  <line x1="200" y1="670" x2="1270" y2="670" class="fragment-divider" />
  <text x="205" y="685" class="fragment-condition">[else valid evidence collected]</text>

  <!-- [Condition 2: Normal routing] -->
  <path d="M 888 700 L 1050 700" class="msg-line" marker-end="url(#sync-arrow)" />
  <text x="898" y="692" class="msg-text">get(recommended_metric)</text>

  <path d="M 1050 740 L 888 740" class="msg-return" marker-end="url(#return-arrow)" />
  <text x="898" y="732" class="msg-text">EffectSizeStrategy instance</text>

  <path d="M 872 800 L 488 800" class="msg-return" marker-end="url(#return-arrow)" />
  <text x="510" y="792" class="msg-text">(Strategy_Instance, DecisionTrace)</text>
  <!-- End of ALT Fragment -->


  <!-- 7. Engine -> Strategy -->
  <path d="M 488 880 L 1210 880" class="msg-line" marker-end="url(#sync-arrow)" />
  <text x="510" y="872" class="msg-text">calculate(x_arr, y_arr)</text>

  <!-- 8. Strategy -> Engine -->
  <path d="M 1210 930 L 488 930" class="msg-return" marker-end="url(#return-arrow)" />
  <text x="510" y="922" class="msg-text">EffectSizeResult (estimate, CI, p_value)</text>

  <!-- 9. Engine Self-call (Packaging) -->
  <path d="M 488 960 L 530 960 L 530 990 L 488 990" class="msg-line" marker-end="url(#sync-arrow)" />
  <text x="540" y="978" class="msg-text">build(DynamicEffectSize)</text>

  <!-- 10. Engine -> Accessor -->
  <path d="M 472 1020 L 268 1020" class="msg-return" marker-end="url(#return-arrow)" />
  <text x="278" y="1012" class="msg-text">DynamicEffectSize (Immutable Contract)</text>

  <!-- 11. Accessor -> User -->
  <path d="M 252 1060 L 80 1060" class="msg-return" marker-end="url(#return-arrow)" />
  <text x="90" y="1052" class="msg-text">DynamicEffectSize (JSON serializable)</text>


  <!-- ==================== Notes (註解區塊) ==================== -->
  <rect x="790" y="270" width="220" height="50" class="note-box" />
  <text x="800" y="290" class="note-text">蒐證階段：涵蓋常態性、變異數、</text>
  <text x="800" y="308" class="note-text">相依性及群組平衡性等多維度診斷。</text>

  <rect x="290" y="1060" width="260" height="50" class="note-box" />
  <text x="300" y="1080" class="note-text">輸出合約包含：估計值、統計誤差、</text>
  <text x="300" y="1098" class="note-text">完整的證據集合與路由決策軌跡。</text>
</svg>
