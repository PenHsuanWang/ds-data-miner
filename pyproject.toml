[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =============================================================================
# PEP 621 — Project Metadata
# =============================================================================
[project]
name = "ds-data-miner"
version = "0.1.0"
description = "EDA profiling engine: full-scan statistical analysis with standardized JSON output."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ds-data-miner contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
pandas = ["pandas>=1.3.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0",
    "hypothesis>=6.0",
    "ruff>=0.4.0",
    "tox>=4.0",
    "bump-my-version>=0.20.0",
    # Include pandas for full test coverage
    "pandas>=1.3.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-autodoc-typehints>=1.25",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
]

[project.urls]
Homepage = "https://github.com/your-org/ds-data-miner"
Documentation = "https://your-org.github.io/ds-data-miner/"
Repository = "https://github.com/your-org/ds-data-miner"
Issues = "https://github.com/your-org/ds-data-miner/issues"

# =============================================================================
# Hatch — Build Configuration
# =============================================================================
[tool.hatch.build.targets.wheel]
packages = ["src/ds_data_miner"]

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# =============================================================================
# Ruff — Linter & Formatter
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "TC002",  # NDArray from numpy.typing is used at runtime in annotations
]

[tool.ruff.lint.isort]
known-first-party = ["ds_data_miner"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# Mypy — Static Type Checking
# =============================================================================
[tool.mypy]
strict = true
# 3.12 is required because numpy >= 2.x stubs use PEP 695 `type` statement
# syntax. This does not affect the runtime support matrix (still 3.10+).
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# =============================================================================
# bump-my-version
# =============================================================================
[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
tag_name = "v{new_version}"
message = "chore: bump version {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/ds_data_miner/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["ds_data_miner"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "pass",
]
