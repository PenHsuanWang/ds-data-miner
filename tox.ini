[tox]
requires =
    tox>=4
env_list =
    py310
    py311
    py312
    py313
    lint
    typecheck
    docs

[testenv]
description = Run unit tests with pytest
deps =
    pytest>=7.0
    pytest-cov>=4.0
    hypothesis>=6.0
    pandas>=1.3.0
commands =
    pytest {posargs:tests/ --cov=ds_data_miner --cov-report=term-missing}

[testenv:lint]
description = Run ruff linter and formatter check
skip_install = true
deps =
    ruff>=0.4.0
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:typecheck]
description = Run mypy static type checker
deps =
    mypy>=1.0
    pydantic>=2.0
    numpy>=1.21
    scipy>=1.7
    pandas-stubs
commands =
    mypy src/

[testenv:docs]
description = Build Sphinx HTML documentation
deps =
    sphinx>=7.0
    sphinx-autodoc-typehints>=1.25
    furo>=2024.1.29
    myst-parser>=2.0
    sphinx-copybutton>=0.5
    numpy>=1.21
    scipy>=1.7
    pydantic>=2.0
    pandas>=1.3.0
changedir = docs
commands =
    sphinx-build -W -b html . _build/html
